<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT Intelligence Monitor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .container {
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: transform 0.2s, background 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.15);
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
      background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 11px;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .recent-section {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .recent-item {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .recent-item:last-child {
      margin-bottom: 0;
    }

    .query-text {
      font-weight: 500;
      margin-bottom: 4px;
    }

    .citation-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .citation-domain {
      font-weight: 500;
    }

    .citation-position {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-primary:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.3);
      transform: translateY(-2px);
    }

    .btn-danger {
      background: rgba(244, 67, 54, 0.3);
      color: #fff;
      border: 1px solid rgba(244, 67, 54, 0.5);
    }

    .btn-danger:hover {
      background: rgba(244, 67, 54, 0.5);
      transform: translateY(-2px);
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      opacity: 0.7;
      font-size: 12px;
    }

    .time-label {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 4px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      opacity: 0.7;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>ChatGPT Intelligence</h1>
      <p>Reverse Engineering Monitor</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-events">0</div>
        <div class="stat-label">Events</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-searches">0</div>
        <div class="stat-label">Searches</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-citations">0</div>
        <div class="stat-label">Citations</div>
      </div>
    </div>

    <div class="recent-section">
      <div class="section-title">Recent Searches</div>
      <div id="recent-searches">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <div class="recent-section">
      <div class="section-title">Recent Citations</div>
      <div id="recent-citations">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <div class="buttons">
      <button class="btn btn-primary" id="btn-dashboard">Dashboard</button>
      <button class="btn btn-primary" id="btn-export">Export JSON</button>
      <button class="btn btn-secondary" id="btn-export-csv">Export CSV</button>
      <button class="btn btn-danger" id="btn-clear">Clear Data</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
